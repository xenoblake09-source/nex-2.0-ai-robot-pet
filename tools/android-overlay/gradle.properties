# Project-wide Gradle settings for NEX.
#
# Memory settings are deliberately conservative: the build must succeed on a
# small machine with ~2 GB RAM. The Kotlin compiler runs in-process so that no
# second JVM has to be started.

org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configureondemand=false

kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

android.useAndroidX=true
android.nonTransitiveRClass=false
android.defaults.buildfeatures.buildconfig=false
