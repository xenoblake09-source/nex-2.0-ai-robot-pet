// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // NEX: the native NexDevice plugin is written in Kotlin.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Lint model generation is very slow and is not required to produce an APK.
// Disabling it keeps CI / small machines from stalling during `assembleRelease`.
allprojects {
    tasks.matching { it.name.toLowerCase().startsWith("lint") }.configureEach {
        enabled = false
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
